tabs:
  main:
    display: Main
    sections:
      -
        fields:
          -
            handle: name
            field:
              type: text
              display: Name
              validate:
                - required
          -
            handle: persons
            field:
              options:
                -
                  key: 1
                  value: One
                -
                  key: 2
                  value: Two
                -
                  key: 3
                  value: Three
              type: select
              display: Persons
              validate:
                - required
          -
            handle: book_date
            field:
              input_type: date
              type: text
              display: Date
              validate:
                - required
          -
            handle: time
            field:
              input_type: time
              type: text
              display: Time
              validate:
                - required
