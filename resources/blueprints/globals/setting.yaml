tabs:
  main:
    display: Main
    sections:
      -
        fields:
          -
            handle: logo
            field:
              max_files: 1
              container: assets
              type: assets
              display: Logo
          -
            handle: favicon
            field:
              max_files: 1
              container: assets
              type: assets
              display: Favicon
          -
            handle: instagram_text
            field:
              default: Instagram
              type: text
              display: 'Instagram text'
          -
            handle: instagram_posts
            field:
              type: replicator
              display: 'Instagram Posts'
              sets:
                new_set_group:
                  display: 'New Set Group'
                  sets:
                    new_set:
                      display: 'New Set'
                      fields:
                        -
                          handle: image
                          field:
                            max_files: 1
                            container: assets
                            type: assets
                            display: Image
                        -
                          handle: url
                          field:
                            default: 'javascript:;'
                            type: text
                            display: URL
          -
            handle: table_sub_title
            field:
              default: Reservations
              type: text
              display: 'Table Sub Title'
          -
            handle: table_title
            field:
              default: 'BOOK A TABLE'
              type: text
              display: 'Table Title'
          -
            handle: booking_button
            field:
              default: 'Book Now'
              type: text
              display: 'Booking Button'
