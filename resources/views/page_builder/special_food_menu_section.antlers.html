 <section class="items-menu-section">
                <div class="container">
                    <div class="row align-items-center">
                        <div class="col-12">
                            <div class="items-menu-title-text text-center">
                                <h5 class="sub-title">{{ section_subtitle }}</h5>
                                <h2>{{ section_title }}</h2>
                                <div class="text-shape">
                                    <svg width="93px" height="1px">
                                        <path fill-rule="evenodd" fill="rgb(193, 153, 119)"
                                            d="M-0.000,0.999 L-0.000,-0.000 L128.000,-0.000 L128.000,0.999 L-0.000,0.999 Z" />
                                    </svg>
                                    <svg width="25.5px" height="25.5px">
                                        <path fill-rule="evenodd" fill="rgb(193, 153, 119)"
                                            d="M5.506,12.383 L12.615,5.493 L19.506,12.601 L12.397,19.492 L5.506,12.383 Z" />
                                        <path fill-rule="evenodd" stroke="rgb(193, 153, 119)" stroke-width="1px"
                                            stroke-linecap="butt" stroke-linejoin="miter" fill="none"
                                            d="M0.511,12.301 L12.697,0.488 L24.511,12.674 L12.324,24.487 L0.511,12.301 Z" />
                                    </svg>
                                    <svg width="93px" height="1px">
                                        <path fill-rule="evenodd" fill="rgb(193, 153, 119)"
                                            d="M-0.000,0.999 L-0.000,-0.000 L128.000,-0.000 L128.000,0.999 L-0.000,0.999 Z" />
                                    </svg>
                                </div>
                            </div>
                        </div>
                        <div class="col-12 col-md-4 pe-0" data-aos="fade-right" data-aos-duration="1000">
                            <div class="items-menu-img">
                                {{ left_image }}<img src="{{ url }}" alt="">{{ /left_image }}
                            </div>
                        </div>
                        <div class="col-12 col-md-8 ps-0">
                            <div class="items-menu-list-box">
                                <ul class="items-menu-text">
                                     {{ menu_items }}
                                    <li>
                                        <div class="items-list">
                                            <a href="{{ link }}" class="menu-item popup-with-form">
                                                <h4>{{name}}</h4>
                                                <svg width="100%" height="5px"><path fill-rule="evenodd" stroke="rgb(227, 227, 227)" stroke-width="2px" stroke-dasharray="1, 4" stroke-linecap="round" stroke-linejoin="miter" fill="none" d="M2.000,0.999 L440,0.999"></path></svg>
                                                <h4>{{ price }}</h4>
                                            </a>
                                        </div>
                                        <p>{{ description }}</p>
                                    </li>
                                    {{ /menu_items }}
                                    
                                </ul>
                                
                            </div>
                        </div>
                    </div>
                </div>
            </section>
